name: Migration Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  migration-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run migration guard
        run: python backend/scripts/check_migration_guard.py
