[alembic]
script_location = alembic
prepend_sys_path = .
# This value is a fallback placeholder only.
# In this project, backend/alembic/env.py and backend/migrate.py override it
# with DATABASE_URL from environment/.env at runtime.
sqlalchemy.url = postgresql+psycopg2://user:password@localhost/hyve

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
